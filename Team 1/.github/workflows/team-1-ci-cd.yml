name: Team 1 CI/CD - Build & Deploy to GKE

on:
  push:
    branches:
      - team-1-branch
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: team-1-branch

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.TEAM1_GCP_SA_KEY }}

      - name: Configure gcloud project
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.TEAM1_GCP_PROJECT }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/new-devopts-k2-advance/app-repo/postgres-test-app:latest"
          docker build -t $IMAGE ./test-app

      - name: Push Docker image
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/new-devopts-k2-advance/app-repo/postgres-test-app:latest"
          docker push $IMAGE

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.TEAM1_GKE_CLUSTER }}
          location: ${{ secrets.TEAM1_GKE_LOCATION }}
          project_id: ${{ secrets.TEAM1_GCP_PROJECT }}

      - name: Helm upgrade/install
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/new-devopts-k2-advance/app-repo/postgres-test-app:latest"
          helm upgrade "postgres-test-app" "helms/test-app" \
            -n "${{ secrets.TEAM1_K8S_NAMESPACE }}" \
            -f "helms/test-app/values-dev.yaml"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres-test-app -n "${{ secrets.TEAM1_K8S_NAMESPACE }}" --timeout=5m
