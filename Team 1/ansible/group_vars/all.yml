    # Kubernetes Configuration
    kubeconfig_path: "~/.kube/config"
    namespace: "default"

    # Environment
    environment: "dev"

    # Ray Configuration
    ray_cluster_name: "ray-cluster"
    ray_head_service: "ray-cluster-head-svc"
    ray_dashboard_port: 8265
    ray_client_port: 10001

    # Deployment Configuration
    wait_timeout: 300
    health_check_retries: 10

    # Terraform configuration paths
    terraform_project_path: "{{ playbook_dir }}/../environments/dev"
    test_app_path: "{{ playbook_dir }}/../test-app"

    # Helm App Deployment Configuration
    helm_release_name: "postgres-test-app"
    helm_chart_path: "{{ playbook_dir }}/../helms/test-app"
    helm_values_file: "values-dev.yaml"
