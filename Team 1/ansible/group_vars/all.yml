# GCP Configuration (from terraform.tfvars)
gcp_project_id: "devopts-k2-advance"
gcp_region: "asia-southeast1" 
gcp_artifact_registry: "asia-southeast1-docker.pkg.dev/devopts-k2-advance/ray-models"

# Docker Configuration
docker_registry_username: "_json_key"
docker_registry_password: "{{ lookup('file', 'gcp-service-account.json') | default('') }}"

# Kubernetes Configuration
kubeconfig_path: "~/.kube/config"
namespace: "default"

# Environment
environment: "dev"

# Ray Configuration
ray_cluster_name: "ray-cluster"
ray_head_service: "ray-cluster-head-svc"
ray_dashboard_port: 8265
ray_client_port: 10001

# Deployment Configuration
wait_timeout: 300
health_check_retries: 10

# Terraform configuration paths
terraform_project_path: "{{ playbook_dir }}/../../environments/{{ environment }}"

# Database Configuration (from terraform.tfvars)
db_name: "postgres-db"
db_user: "postgres"
instance_name: "dev-postgres"

# GKE Configuration (from terraform.tfvars)
cpu_pool_machine_type: "e2-medium"
cpu_node_count: 1
enable_gpu_pool: true
gpu_machine_type: "n1-standard-4"
gpu_type: "nvidia-tesla-p4"
gpu_count: 1
