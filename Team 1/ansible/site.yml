---
- name: Ray AI Model Deployment Pipeline
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  
  pre_tasks:
    - name: Display deployment configuration
      ansible.builtin.debug:
        msg: |
          🚀 Starting simplified Ray AI deployment...
          
          Environment: {{ environment }}
          Namespace: {{ namespace }}
          Ray Cluster: {{ ray_cluster_name }}
          
          Components to deploy:
          ✓ Ray RBAC (ServiceAccount, Role, RoleBinding)
          ✓ Ray Cluster (head + GPU workers)  
          ✓ Ray Client (development pod)
          ✓ ConfigMap (AI model Python code)
          ✓ Ray Serve (Phi3 AI model from ray-serve folder)
          
          Prerequisites:
          - kubectl is configured 
          - Kubernetes cluster is accessible

  tasks:
    - name: Prepare Docker Environment
      include_role:
        name: docker
      tags: ['docker', 'prepare']

    - name: Deploy to Kubernetes
      include_role:
        name: k8s
      tags: ['kubernetes', 'deploy']
