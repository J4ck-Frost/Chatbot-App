---
- name: Set clean artifact registry URL
  set_fact:
    artifact_registry_host: "{{ tf_outputs.artifact_registry_url.value | regex_replace('^https://', '') }}"

# -------------------------------------------------------------
# 1. Docker: Build App Image
# -------------------------------------------------------------
- name: Authenticate docker to Artifact Registry
  ansible.builtin.command: >
    gcloud auth configure-docker {{ tf_outputs.region.value }}-docker.pkg.dev
  changed_when: true

- name: Build Docker image locally
  community.docker.docker_image:
    name: "{{ artifact_registry_host }}/{{ helm_release_name }}:latest"
    source: build
    build:
      path: "{{ test_app_path }}"

- name: Push Docker image to Artifact Registry
  community.docker.docker_image:
    name: "{{ artifact_registry_host }}/{{ helm_release_name }}:latest"
    source: local
    push: yes

# -------------------------------------------------------------
# 2. Helm: Install or Upgrade Release
# -------------------------------------------------------------
- name: Ensure Helm is installed
  ansible.builtin.command: helm version
  register: helm_check
  failed_when: helm_check.rc != 0

- name: Check if Helm release exists
  ansible.builtin.command: helm status {{ helm_release_name }}
  register: helm_status
  ignore_errors: yes

- name: Install Helm release if not exists
  ansible.builtin.command: >
    helm install "{{ helm_release_name }}" "{{ helm_chart_path }}"
    -f "{{ helm_chart_path }}/{{ helm_values_file }}"
  when: helm_status.rc != 0
  register: helm_output

- name: Upgrade Helm release if exists
  ansible.builtin.command: >
    helm upgrade "{{ helm_release_name }}" "{{ helm_chart_path }}"
    -f "{{ helm_chart_path }}/{{ helm_values_file }}"
  when: helm_status.rc == 0
  register: helm_output

- debug:
    msg: "{{ helm_output.stdout }}"


# -------------------------------------------------------------
# 3. Wait for Deployment Availability
# -------------------------------------------------------------
- name: Wait for deployment to become ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ helm_release_name }}"
  register: deployment_info
  until: >
    deployment_info.resources
    and deployment_info.resources[0].status.availableReplicas is defined
    and deployment_info.resources[0].status.availableReplicas | int >= 1
  retries: 30
  delay: 10


# -------------------------------------------------------------
# 4. Get External Load Balancer IP
# -------------------------------------------------------------
- name: Get service info
  kubernetes.core.k8s_info:
    kind: Service
    namespace: "{{ namespace }}"
    name: "{{ helm_release_name }}-service"
  register: svc

- name: Display external IP
  debug:
    msg: >
      🌐 Service External IP:
      {{ svc.resources[0].status.loadBalancer.ingress[0].ip
           if svc.resources[0].status.loadBalancer.ingress is defined
           else 'Pending...' }}
