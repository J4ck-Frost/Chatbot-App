---
# ----------------------------------------------------------------
# STEP 0: AUTHENTICATION (IMPORTANT - FIX LOCALHOST:8080 ISSUE)
# ----------------------------------------------------------------
- name: Get GKE credentials
  ansible.builtin.command: >
    gcloud container clusters get-credentials {{ tf_outputs.kubernetes_cluster_name.value }}
    --zone {{ tf_outputs.region.value }}-a
    --project {{ tf_outputs.project_id.value }}
  changed_when: false

# ----------------------------------------------------------------
# STEP 1: SETUP ENVIRONMENT (OPERATOR & SECRET)
# ----------------------------------------------------------------

# 1. Add KubeRay Helm Repository
- name: Add KubeRay Helm repository
  kubernetes.core.helm_repository:
    name: kuberay
    repo_url: "https://ray-project.github.io/kuberay-helm/"

# 2. Install KubeRay Operator via Helm
- name: Install KubeRay Operator via Helm
  kubernetes.core.helm:
    name: kuberay-operator
    chart_ref: kuberay/kuberay-operator
    release_namespace: "{{ namespace }}"
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig_path }}"

# 3. Create Secret for Ray Dashboard
- name: Create Secret for Ray Dashboard
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ray-dashboard-secret
        namespace: "{{ namespace }}"
      type: Opaque
      stringData:
        password: "password123"
    kubeconfig: "{{ kubeconfig_path }}"

# ----------------------------------------------------------------
# STEP 2: RAY INFRASTRUCTURE (CLUSTER)
# ----------------------------------------------------------------

# 4. Deploy Ray RBAC
- name: Deploy Ray RBAC
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../ray-deployment/security/ray-rbac.yaml"
    namespace: "{{ namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"

# 5. Deploy Ray Cluster
- name: Deploy Ray Cluster (Qwen Image)
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../ray-deployment/cluster/ray-cluster.yaml"
    namespace: "{{ namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"

# 6. Wait for Worker Nodes to be Ready
- name: Wait for Ray Worker Nodes to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - "ray.io/cluster={{ ray_cluster_name }}"
      - "ray.io/node-type=worker"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ wait_timeout }}"
    kubeconfig: "{{ kubeconfig_path }}"

# ----------------------------------------------------------------
# STEP 3: DEPLOY QWEN MODEL
# ----------------------------------------------------------------

# 7. Create ConfigMap with Qwen Code
- name: Create ConfigMap with Qwen code
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: qwen-serve-script
        namespace: "{{ namespace }}"
      data:
        qwen_serve.py: "{{ lookup('file', ai_source_path + '/ray-serve/qwen_serve.py') }}"
    kubeconfig: "{{ kubeconfig_path }}"

# 8. Deploy Qwen Ray Serve Deployment
- name: Deploy Qwen Ray Serve
  kubernetes.core.k8s:
    state: present
    src: "{{ ai_source_path }}/ray-serve/qwen-ray-serve-deployment.yaml"
    namespace: "{{ namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"

# 9. Wait for Qwen Service to be Ready
- name: Wait for Qwen Service to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ ai_service_name }}"
    namespace: "{{ namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: ai_svc
  until: ai_svc.resources | length > 0
  retries: 20
  delay: 10
