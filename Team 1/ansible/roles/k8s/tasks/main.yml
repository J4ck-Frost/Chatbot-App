---
# ----------------------------------------------------------------
# STEP 0: AUTHENTICATION (IMPORTANT - FIX LOCALHOST:8080 ISSUE)
# ----------------------------------------------------------------
- name: Get GKE credentials
  ansible.builtin.command: >
    gcloud container clusters get-credentials {{ tf_outputs.kubernetes_cluster_name.value }}
    --zone {{ tf_outputs.region.value }}-a
    --project {{ tf_outputs.project_id.value }}
  changed_when: false

# ----------------------------------------------------------------
# STEP 1: SETUP ENVIRONMENT (OPERATOR & SECRET)
# ----------------------------------------------------------------

# 1. Add KubeRay Helm Repository
- name: Add KubeRay Helm repository
  kubernetes.core.helm_repository:
    name: kuberay
    repo_url: "https://ray-project.github.io/kuberay-helm/"

# 2. Install KubeRay Operator via Helm
- name: Install KubeRay Operator via Helm
  kubernetes.core.helm:
    name: kuberay-operator
    chart_ref: kuberay/kuberay-operator
    release_namespace: "{{ namespace }}"
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig_path }}"

# 3. Create Secret for Ray Dashboard
- name: Create Secret for Ray Dashboard
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ray-dashboard-secret
        namespace: "{{ namespace }}"
      type: Opaque
      stringData:
        password: "password123"
    kubeconfig: "{{ kubeconfig_path }}"


# ----------------------------------------------------------------
# STEP 2: DEPLOY AI STACK (RBAC + CLUSTER + MODEL + SERVICE)
# ----------------------------------------------------------------
- name: Deploy AI Service via Helm
  kubernetes.core.helm:
    name: qwen-service
    chart_ref: "{{ playbook_dir }}/../helms/ai-service"
    release_namespace: "{{ namespace }}"
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      image:
        repository: "{{ gcp_repo_url }}/{{ ai_image_name }}"
        tag: "{{ ai_image_tag }}"
      
      # [TUYỆT CHIÊU] Ansible đọc file thật, rồi nhét chữ vào biến pythonCode của Helm
      pythonCode: "{{ lookup('file', ai_source_path + '/ray-serve/qwen_serve.py') }}"
