---
- name: Check if Docker is running
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  failed_when: false

- name: Fail if Docker is not running
  ansible.builtin.fail:
    msg: "Docker is not running. Please start Docker service."
  when: docker_info.rc != 0

# Note: Only using base Ray image - no custom builds needed
# Ray Serve uses ConfigMap for code injection with rayproject/ray:2.8.0

- name: Pull Ray base image to ensure it's available locally
  community.docker.docker_image:
    name: "rayproject/ray"
    tag: "2.8.0"
    source: pull
  ignore_errors: yes

- name: Display Docker preparation complete
  ansible.builtin.debug:
    msg: |
      🐳 Docker preparation complete!
      
      Images available:
      ✓ rayproject/ray:2.8.0 (base image for Ray Serve)
      
      Ray Serve will use ConfigMap for AI model code injection.
