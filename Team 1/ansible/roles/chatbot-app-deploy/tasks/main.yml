---
- name: Load Terraform outputs
  set_fact:
    gcp_project_id: "{{ tf_outputs.project_id.value }}"
    gcp_repo_url: "{{ tf_outputs.artifact_registry_url.value | regex_replace('^https://', '') }}"

# Build image app mới
- name: Build Chatbot App Image
  ansible.builtin.command: >
    gcloud builds submit "{{ playbook_dir }}/../chatbot-app"
    --tag "{{ gcp_repo_url }}/chatbot-app:latest"
    --project "{{ gcp_project_id }}"
    --quiet
  changed_when: true

# Deploy helm chart app mới
- name: Deploy Chatbot App Helm Chart
  ansible.builtin.command: >
    helm upgrade --install chatbot-app
    "{{ playbook_dir }}/../helms/chatbot-app"
    -f "{{ playbook_dir }}/../helms/chatbot-app/values-dev.yaml"
    --set image.repository="{{ gcp_repo_url }}/chatbot-app"
    --set image.tag="latest"
    --set env.AI_API_URL="http://{{ ai_service_name }}:{{ ai_service_port }}/chat"
  changed_when: true

- name: Display Integration Info
  ansible.builtin.debug:
    msg: |
      🎉 App Deployed Successfully!
      🔗 App is connected to AI at: http://{{ ai_service_name }}:{{ ai_service_port }}/chat