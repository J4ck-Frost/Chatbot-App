apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-gpu-cluster
  namespace: default
spec:
  rayVersion: '2.8.0'
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      metrics-export-port: '8080'
      ray-client-server-port: '10001'
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.8.0-gpu
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8080
            name: metrics
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: 1
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: 1
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_DASHBOARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-dashboard-secret
                key: password
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-tesla-p4
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
  workerGroupSpecs: []
---
apiVersion: v1
kind: Service
metadata:
  name: ray-gpu-head-svc
  namespace: default
spec:
  ports:
  - name: dashboard
    port: 8265
    protocol: TCP
    targetPort: 8265
  - name: client
    port: 10001
    protocol: TCP
    targetPort: 10001
  - name: gcs-server
    port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    ray.io/cluster: ray-gpu-cluster
    ray.io/node-type: head
  type: ClusterIP