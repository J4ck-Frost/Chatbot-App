apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster
  namespace: default
spec:
  rayVersion: '2.8.0'
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      limits:
        cpu: "200m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      metrics-export-port: '8080'
      ray-client-server-port: '10001'
      num-cpus: '0'
    template:
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: cpu-pool
        containers:
        - name: ray-head
          image: rayproject/ray:2.8.0
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8080
            name: metrics
          resources:
            limits:
              cpu: "800m"
              memory: "2Gi"
            requests:
              cpu: "400m"
              memory: "1Gi"
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_DASHBOARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-dashboard-secret
                key: password
  workerGroupSpecs:
  - groupName: gpu-workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "2"
      num-gpus: "1"
    template:
      spec:
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
        nodeSelector:
          cloud.google.com/gke-nodepool: gpu-pool
        containers:
        - name: ray-worker
          image: rayproject/ray:2.8.0-gpu
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "1500m" 
              memory: "4Gi" 
            requests:
              nvidia.com/gpu: 1
              cpu: "500m"
              memory: "2Gi"
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head-svc
  namespace: default
spec:
  ports:
  - name: dashboard
    port: 8265
    protocol: TCP
    targetPort: 8265
  - name: client
    port: 10001
    protocol: TCP
    targetPort: 10001
  - name: gcs-server
    port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    ray.io/cluster: ray-cluster
    ray.io/node-type: head
  type: ClusterIP