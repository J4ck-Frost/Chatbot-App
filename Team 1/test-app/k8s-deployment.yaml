apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test-app
  labels:
    app: postgres-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-test-app
  template:
    metadata:
      labels:
        app: postgres-test-app
    spec:
      serviceAccountName: postgres-test-app-sa
      containers:
      - name: postgres-test-app
        image: asia-southeast1-docker.pkg.dev/striking-figure-474817-a3/team1-ai-repo/postgres-test-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "num1-database"
        - name: DB_USER
          value: "num1-user"
        - name: DB_PASSWORD
          value: "Abc@12345678"
        - name: DB_SSL_MODE
          value: "disable"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"

        # --- Cloud SQL Auth Proxy sidecar ---
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.10.1
        args:
          - "striking-figure-474817-a3:asia-southeast1:sql-instance-dev"
          - "--port=5432"
          - "--private-ip"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test-app-service
spec:
  selector:
    app: postgres-test-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer