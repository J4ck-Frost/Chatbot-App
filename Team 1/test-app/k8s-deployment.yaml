apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test-app
  labels:
    app: postgres-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-test-app
  template:
    metadata:
      labels:
        app: postgres-test-app
    spec:
      containers:
        - name: postgres-test-app
          image: asia-southeast1-docker.pkg.dev/devopts-k2-advance/app-repo/test-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "10.144.0.3" # Cloud SQL private IP
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "postgres-db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "abcxyz"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test-app-service
spec:
  selector:
    app: postgres-test-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
