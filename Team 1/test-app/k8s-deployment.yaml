apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test-app
  labels:
    app: postgres-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-test-app
  template:
    metadata:
      labels:
        app: postgres-test-app
    spec:
      containers:
        - name: postgres-test-app
          image: us-central1-docker.pkg.dev/logical-iridium-474603-b4/app-repo/test-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "127.0.0.1" # tạm thời dùng localhost nếu chưa có Cloud SQL
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "num1-database"
            - name: DB_USER
              value: "num1-user"
            - name: DB_PASSWORD
              value: "Abc@12345678"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test-app-service
spec:
  selector:
    app: postgres-test-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
