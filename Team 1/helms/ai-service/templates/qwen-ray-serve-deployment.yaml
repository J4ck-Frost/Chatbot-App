apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-ray-serve
  namespace: default
  labels:
    app: qwen-ray-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-ray-serve
  template:
    metadata:
      labels:
        app: qwen-ray-serve
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Client này rất nhẹ, không cần node GPU, chạy node thường cũng được
      # Nhưng để tiện thì cứ để node selector cũ cũng không sao
      tolerations:
      - key: "cloud.google.com/gke-preemptible"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

      containers:
      - name: qwen-serve
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Connecting to Ray Cluster..."
            # Script này sẽ gửi lệnh sang Ray Cluster để chạy Model bên đó
            python /app/ray-serve/qwen_serve.py
        
        volumeMounts:
        # Chỉ cần mount Code thôi, KHÔNG cần mount /data/models nữa
        - name: code-volume
          mountPath: /app/ray-serve/qwen_serve.py
          subPath: qwen_serve.py
        
        ports:
        - containerPort: 8000
          name: serve
        
        env:
        # [BẮT BUỘC] Phải có dòng này để trỏ sang Ray Cluster (File 1)
        - name: RAY_ADDRESS
          value: "ray://ray-cluster-head-svc:10001"
        - name: PYTHONUNBUFFERED
          value: "1"
        
        resources:
          requests:
            cpu: "500m" # Client rất nhẹ
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
            
      volumes:
      - name: code-volume
        configMap:
          name: qwen-serve-script
      # KHÔNG CÒN volumes model-storage Ở ĐÂY NỮA

---
apiVersion: v1
kind: Service
metadata:
  name: qwen-unified-service
  namespace: default
  labels:
    app: qwen-ray-serve
spec:
  type: LoadBalancer
  selector:
    ray.io/cluster: ray-cluster
    ray.io/node-type: head
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: api