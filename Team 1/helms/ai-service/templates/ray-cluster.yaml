apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster
  namespace: default
spec:
  rayVersion: '2.52.0'
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      limits:
        cpu: "200m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      metrics-export-port: '8080'
      ray-client-server-port: '10001'
      num-cpus: '0'
    template:
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: cpu-pool
        containers:
        - name: ray-head
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8080
            name: metrics
          - containerPort: 8000
            name: serve
          resources:
            limits:
              cpu: "1"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_DASHBOARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-dashboard-secret
                key: password
  workerGroupSpecs:
  - groupName: gpu-workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "2"
      num-gpus: "1"
    template:
      spec:
        # [QUAN TRỌNG 1]: Set quyền cho user Ray (UID 1000) được phép ghi vào ổ cứng
        securityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsGroup: 1000
        
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
        nodeSelector:
          cloud.google.com/gke-nodepool: gpu-pool
          
        containers:
        - name: ray-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "16Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: "8Gi"
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
            
          # [QUAN TRỌNG 2]: Mount thư mục /data vào trong container
          volumeMounts:
          - mountPath: "/data"
            name: model-storage

        # [QUAN TRỌNG 3]: Khai báo Volume lấy từ PVC đã tạo
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc