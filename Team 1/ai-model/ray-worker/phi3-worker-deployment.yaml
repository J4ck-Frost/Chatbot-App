
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phi3-worker-model
  namespace: default
  labels:
    app: phi3-worker-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phi3-worker-model
  template:
    metadata:
      labels:
        app: phi3-worker-model
    spec:
      tolerations:
      - key: "cloud.google.com/gke-preemptible"
        operator: "Equal" 
        value: "true"
        effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-pool
      containers:
      - name: phi3-model
        image: rayproject/ray:2.8.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --user ray[default] fastapi uvicorn pydantic
          cd /scripts
          python phi3_worker_host.py --api
        ports:
        - containerPort: 8000
          name: api
        volumeMounts:
        - name: phi3-worker-script
          mountPath: /scripts
        env:
        - name: RAY_ADDRESS
          value: "ray://ray-cluster-head-svc:10001"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
      volumes:
      - name: phi3-worker-script
        configMap:
          name: phi3-worker-script
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: phi3-unified-service
  namespace: default
  labels:
    app: phi3-worker-model
spec:
  type: LoadBalancer
  selector:
    app: phi3-worker-model
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: api