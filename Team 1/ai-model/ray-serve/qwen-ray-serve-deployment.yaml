apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-ray-serve
  namespace: default
  labels:
    app: qwen-ray-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-ray-serve
  template:
    metadata:
      labels:
        app: qwen-ray-serve
    spec:
      tolerations:
      - key: "cloud.google.com/gke-preemptible"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool
      
      # [SỬA 1] Lỗi thụt đầu dòng (Indentation)
      # initContainers phải nằm ngang hàng với containers (thuộc spec), không phải thuộc nodeSelector
      initContainers:
      - name: fix-volume-permissions
        image: busybox:latest
        command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R 775 /data"]
        volumeMounts:
        - name: model-storage
          mountPath: /data

      containers:
      - name: qwen-serve
        image: asia-southeast1-docker.pkg.dev/striking-figure-474817-a3/team1-ai-repo/qwen2-serve:v1
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Starting Qwen2.5 Ray Serve..."
            python /app/ray-serve/qwen_serve.py
        
        # [SỬA 2] Container chính CŨNG PHẢI mount ổ cứng
        # Nếu không mount, nó sẽ không thấy thư mục /data mà initContainer vừa sửa quyền
        volumeMounts:
        - name: model-storage
          mountPath: /data  # Hoặc /data/models tùy code python của bạn
        
        ports:
        - containerPort: 8000
          name: serve
        env:
        - name: RAY_ADDRESS
          value: "ray://ray-cluster-head-svc:10001"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RAY_SERVE_ENABLE_EXPERIMENTAL_STREAMING
          value: "1"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: 1
      
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  # Đổi tên service cho đúng với model Qwen
  name: qwen-unified-service
  namespace: default
  labels:
    app: qwen-ray-serve
spec:
  type: LoadBalancer
  selector:
    ray.io/cluster: ray-cluster
    ray.io/node-type: head
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: api