apiVersion: apps/v1
kind: Deployment
metadata:
  name: phi3-ray-serve
  namespace: default
  labels:
    app: phi3-ray-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phi3-ray-serve
  template:
    metadata:
      labels:
        app: phi3-ray-serve
    spec:
      tolerations:
      - key: "cloud.google.com/gke-preemptible"
        operator: "Equal" 
        value: "true"
        effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-pool
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gke-app-cluster-cpu-pool-70fa3fb1-q4bj
      containers:
      - name: phi3-serve
        image: rayproject/ray:2.8.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🚀 Starting Phi3 Ray Serve deployment..."
          pip install ray[serve] fastapi uvicorn pydantic
          echo "📦 Packages installed successfully"
          cd /scripts
          echo "📂 Changed to scripts directory"
          echo "🔄 Starting Python script..."
          python phi3_serve.py
        ports:
        - containerPort: 8000
          name: serve
        volumeMounts:
        - name: phi3-serve-script
          mountPath: /scripts
        env:
        - name: RAY_ADDRESS
          value: "ray://ray-cluster-head-svc:10001"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RAY_SERVE_ENABLE_EXPERIMENTAL_STREAMING
          value: "1"
        resources:
          requests:
            cpu: "25m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 180
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 240
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: phi3-serve-script
        configMap:
          name: phi3-serve-script
          defaultMode: 0755

