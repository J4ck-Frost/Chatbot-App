name: CI/CD - AI Model Service

on:
  push:
    branches: [ "team-1/long_ngo" ]
    paths:
      - 'Team 1/ai-model/**'
      - 'Team 1/helms/ai-service/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.TEAM1_GCP_PROJECT }}
  GAR_REPO: asia-southeast1-docker.pkg.dev/${{ secrets.TEAM1_GCP_PROJECT }}/team1-ai-repo
  IMAGE_NAME: qwen2-serve
  SOURCE_PATH: "./Team 1/ai-model"
  HELM_PATH: "./Team 1/helms/ai-service"
  PYTHON_SCRIPT_PATH: "Team 1/ai-model/ray-serve/qwen_serve.py"

jobs:
  build-deploy-model:
    runs-on: ubuntu-latest
    steps:
      # --- BƯỚC NÀY ĐỂ XÓA RÁC CỦA GITHUB (ANDROID, DOTNET...) ---
      - name: 🧹 Free Disk Space (Dọn rác máy ảo)
        run: |
          echo "Dung lượng TRƯỚC khi dọn:"
          df -h
          
          # 1. Xóa Android SDK (Nặng nhất ~10GB) - Mình ko dùng Mobile nên xóa
          sudo rm -rf /usr/local/lib/android
          
          # 2. Xóa .NET (Nặng ~6GB)
          sudo rm -rf /usr/share/dotnet
          
          # 3. Xóa các Docker Image có sẵn của GitHub (Không phải của bạn)
          sudo docker image prune --all --force
          
          echo "Dung lượng SAU khi dọn:"
          df -h
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. Auth & Setup ---
      - name: Auth GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.TEAM1_GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ vars.TEAM1_GKE_CLUSTER }}
          location: ${{ vars.TEAM1_GKE_LOCATION }}

      # --- 2. Build & Push Image (Có Caching) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5  # Dùng action xịn của Docker
        with:
          context: ${{ env.SOURCE_PATH }}
          push: true
          tags: ${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Dùng cache từ chính GitHub Actions để lần sau build siêu nhanh
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3. Install Helm & KubeRay Operator (BƯỚC MỚI QUAN TRỌNG) ---
      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Install KubeRay Operator (Infrastructure)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          
          helm upgrade --install kuberay-operator kuberay/kuberay-operator \
            --namespace "${{ vars.TEAM1_K8S_NAMESPACE }}" \
            --create-namespace \
            --wait

      # --- 4. Deploy Model Service ---
      - name: Deploy Model Service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install qwen-service "$HELM_PATH" \
            -n "${{ secrets.TEAM1_K8S_NAMESPACE }}" \
            --set image.repository="$GAR_REPO/$IMAGE_NAME" \
            --set image.tag="$IMAGE_TAG" \
            --set-file pythonCode="$PYTHON_SCRIPT_PATH" \
            --wait=false
      # --- 5. Verify Health & Auto Rollback ---
      - name:  Verify Health & Auto Rollback
        env:
          NAMESPACE: ${{ vars.TEAM1_K8S_NAMESPACE }} # <--- Đưa Namespace vào biến ENV
        run: |
          echo " Đang chờ Pod 'qwen-ray-serve' khởi động trong Namespace: $NAMESPACE..."
          
          # 1. Chờ tối đa 5 phút
          kubectl wait --for=condition=ready pod -l app=qwen-ray-serve -n $NAMESPACE --timeout=300s || true

          # Lấy tên Pod Client thực tế (Sửa default -> $NAMESPACE)
          CLIENT_POD=$(kubectl get pod -l app=qwen-ray-serve -n $NAMESPACE -o jsonpath="{.items[0].metadata.name}")
          
          # Kiểm tra nếu không tìm thấy Pod (Biến rỗng) thì báo lỗi ngay
          if [ -z "$CLIENT_POD" ]; then
             echo " LỖI: Không tìm thấy Pod nào tên 'qwen-ray-serve' trong namespace '$NAMESPACE'!"
             exit 1
          fi

          echo " Đang test API trực tiếp trên Pod: $CLIENT_POD"
          
          # 2. Gọi thử API /health (Sửa default -> $NAMESPACE)
          RETRIES=12
          SUCCESS=false

          for i in $(seq 1 $RETRIES); do
            # Chạy curl bên trong Pod
            HTTP_STATUS=$(kubectl exec $CLIENT_POD -n $NAMESPACE -- python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').getcode())" || echo "000")
            
            if [ "$HTTP_STATUS" == "200" ]; then
              echo " Health Check OK! (Attempt $i/$RETRIES)"
              SUCCESS=true
              break
            else
              echo " Health Check chưa sẵn sàng (Code: $HTTP_STATUS). Đang chờ... (Attempt $i/$RETRIES)"
              sleep 10
            fi
          done

          # 3. QUYẾT ĐỊNH & ROLLBACK
          if [ "$SUCCESS" = true ]; then
            echo " DEPLOYMENT THÀNH CÔNG RỰC RỠ!"
          else
            echo " DEPLOYMENT THẤT BẠI! API KHÔNG TRẢ LỜI 200 OK."
            
            echo " --- LOGS CỦA POD LỖI (50 dòng cuối) ---"
            kubectl logs $CLIENT_POD -n $NAMESPACE --tail=50
            
            echo " ĐANG KÍCH HOẠT ROLLBACK VỀ PHIÊN BẢN TRƯỚC..."
            # Lệnh rollback cũng phải đúng namespace
            helm rollback qwen-service 0 -n $NAMESPACE
            
            echo " Đã Rollback xong. Pipeline sẽ báo Failed."
            exit 1
          fi